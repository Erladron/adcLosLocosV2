<ion-content fullscreen="true" class="login-content" data-cy="login-page">
  <div class="background-logo">
    <img src="assets/img/escudo.png" alt="Escudo">
  </div>

  <div class="login-container">

    <!-- 🔄 SECCIÓN PRINCIPAL: Formulario limpio desde cero -->
    <div class="form-card" *ngIf="!cargando">

      <div class="header-section">
        <div class="logo-circle">
          <img src="assets/img/escudo.png" alt="Logo">
        </div>
        <h2>Bienvenido</h2>
        <p>Accede a tu cuenta de socio</p>
      </div>

      <form class="form-section" (ngSubmit)="ingresar()">

        <ion-item lines="none">
          <!-- AÑADIDO: name="email" -->
          <ion-input label="Email" labelPlacement="floating" type="email" [(ngModel)]="email" name="email"
            placeholder="ejemplo@correo.com" data-cy="input-login-email">
          </ion-input>
        </ion-item>

        <ion-item lines="none">
          <!-- AÑADIDO: name="password" -->
          <ion-input [type]="showPassword ? 'text' : 'password'" label="Contraseña" labelPlacement="floating"
            [(ngModel)]="password" name="password" data-cy="input-login-password">
          </ion-input>
          <ion-button slot="end" fill="clear" (click)="showPassword = !showPassword" class="eye-button"
            data-cy="btn-login-toggle-password">
            <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </ion-button>
        </ion-item>

        <div class="button-section">
          <!-- AÑADIDO: type="submit" para vincularlo al comportamiento del formulario -->
          <ion-button type="submit" expand="block" [disabled]="cargando" class="main-button" data-cy="btn-login-submit">
            <span data-cy="btn-login-text">Entrar</span>
          </ion-button>
        </div>

      </form>

    </div>

    <!-- ⏳ SECCIÓN DE ESPERA: Controlada 100% por clases SCSS -->
    <div class="form-card loading-card" *ngIf="cargando">
      <ion-spinner name="crescent" data-cy="login-spinner" class="loading-spinner"></ion-spinner>
      <p class="loading-text">Conectando...</p>
    </div>

    <footer class="app-footer-fixed">
      <p>© 2026 ACD Los Locos. Gestión Digital Oficial.</p>
    </footer>
  </div>
</ion-content>
