<app-page-header title="Gestión de Eventos" [showMenu]="true" [showBack]="true" data-cy="page-header"></app-page-header>

<ion-content fullscreen="true" class="home-content" data-cy="events-page-content">

  <div class="home-container unified-events-container">

    <!-- 🎛️ FILTROS POR TIPO DE EVENTO (ARRIBA DEL TODO, BAJO EL HEADER) -->
    <ion-segment [scrollable]="true" [value]="currentFilter" (ionChange)="setFilter($event.detail.value)" mode="md"
      class="custom-scroll-segment" data-cy="events-filter-segment">
      <ion-segment-button value="todos" data-cy="filter-btn-todos"><ion-label>Todos</ion-label></ion-segment-button>
      <ion-segment-button value="asamblea"
        data-cy="filter-btn-asambleas"><ion-label>Asambleas</ion-label></ion-segment-button>
      <ion-segment-button value="comida"
        data-cy="filter-btn-comidas"><ion-label>Comidas</ion-label></ion-segment-button>
      <ion-segment-button value="quedada"
        data-cy="filter-btn-quedadas"><ion-label>Quedadas</ion-label></ion-segment-button>
      <ion-segment-button value="feria" data-cy="filter-btn-feria"><ion-label>Feria</ion-label></ion-segment-button>
    </ion-segment>

    <!-- CALENDARIO DASHBOARD CARD -->
    <div class="calendar-dashboard-card">

      <!-- Escudo en Marca de Agua -->
      <img src="assets/img/escudo.png" alt="Marca de agua Peña" class="calendar-watermark-logo" />
      <div class="calendar-container">
        <!-- Cabecera Elegante, Distribuida y Centrada -->
        <div class="calendar-header">
          <button type="button" class="nav-btn" (click)="changeMonth(-1)" aria-label="Mes anterior">
            <ion-icon name="chevron-back-outline"></ion-icon>
          </button>

          <div class="month-title">
            <ion-icon name="calendar-outline"></ion-icon>
            <span>{{ viewDate | date:'MMMM yyyy':'':locale | titlecase }}</span>
          </div>

          <button type="button" class="nav-btn" (click)="changeMonth(1)" aria-label="Mes siguiente">
            <ion-icon name="chevron-forward-outline"></ion-icon>
          </button>
        </div>

        <!-- Vista del Mes -->
        <mwl-calendar-month-view [viewDate]="viewDate" [events]="calendarEvents" [refresh]="refresh"
          [activeDayIsOpen]="false" [weekStartsOn]="weekStartsOn" [locale]="locale"
          (beforeViewRender)="beforeMonthViewRender($event)" (dayClicked)="onDayClicked($event.day)">
        </mwl-calendar-month-view>
      </div>
    </div>


    <!-- 📋 LISTADO MINIMALISTA DE EVENTOS DESPLEGADOS PARA EL DÍA SELECCIONADO -->
    <div class="events-list-container" data-cy="events-list-wrapper">

      <!-- Alerta si no hay convocatorias para ese día/filtro -->
      <div class="glass-card empty-warning-card" *ngIf="eventosDelDia.length === 0" data-cy="events-empty-warning">
        <ion-icon name="alert-circle-outline"></ion-icon>
        <p>No hay convocatorias para esta fecha o categoría.</p>
      </div>

      <!-- Tarjeta interactiva estilizada (Al hacer clic redirige al detalle) -->
      <div class="event-minimal-card" *ngFor="let event of eventosDelDia"
        [style.--custom-img]="'url(' + getEventBgImage(event) + ')'" [routerLink]="['/events', event.id]"
        data-cy="event-card">
        <div class="minimal-card-body">
          <div class="event-type-icon-wrapper-mini">
            <ion-icon [name]="getIconForType(event.type)"></ion-icon>
          </div>
          <h2 class="event-minimal-title" data-cy="event-title-text">{{ event.title }}</h2>
          <ion-icon name="chevron-forward-outline" class="arrow-link-icon"></ion-icon>
        </div>
      </div>

    </div>

    <!-- FAB: BOTÓN FLOTANTE PARA CREAR EVENTOS (SOLO ADMINS) -->
    <ion-fab *ngIf="isAdmin" vertical="bottom" horizontal="end" slot="fixed" class="peña-fab-btn-native">
      <ion-fab-button (click)="nuevoEvento()" color="secondary" data-cy="btn-create-event-fab">
        <ion-icon name="add-outline"></ion-icon>
      </ion-fab-button>
    </ion-fab>

  </div>
</ion-content>
